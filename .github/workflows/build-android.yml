name: build-android

# Builds the Android APK (arm64, "standard" = Mainline flavor, Release) on every push to the
# android branch, signed with the repo's debug keystore so it can be side-loaded.
on:
  push:
    branches:
      - android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: normal
            app_id: dev.eglantine.emulator
            app_name: Eglantine
            cmake_args: ""
          - variant: frames-ahead
            app_id: dev.eglantine.emulator.fa
            app_name: Eglantine FA
            cmake_args: -DCMAKE_CXX_FLAGS=-DEGLANTINE_FRAMES_AHEAD_DEFAULT
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools ccache
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36"

      - name: Build APK
        shell: bash
        env:
          CCACHE: "false"
          EGL_APP_ID: ${{ matrix.app_id }}
          EGL_APP_NAME: ${{ matrix.app_name }}
        run: |
          set -euo pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b Release ${{ matrix.cmake_args }}
          ls -la artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-android-${{ matrix.variant }}
          path: artifacts/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
