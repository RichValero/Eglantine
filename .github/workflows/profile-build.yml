name: profile-build

# Build for profiling: Linux x86_64 only, with debug symbols. Runs on every push to perf-fefw.
on:
  push:
    branches:
      - perf-fefw
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      sha: ${{ github.sha }}
      version: profile-${{ github.ref_name }}-${{ github.sha }}
      refspec: ${{ github.ref }}
      tag: profile
      release: false
      nightly: true
      pgo: none
      symbols: true
